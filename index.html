<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Machine Guide AR</title>
<link rel="stylesheet" href="style.css" />

<!-- AR engine: A-Frame + MindAR image tracking (both loaded from CDN) -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- Splash / loading -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p id="loading-text">Starting camera…</p>
    <button id="loading-retry" class="ghost-btn hidden">Retry</button>
  </div>

  <!-- ============ AR CAMERA SCENE ============ -->
  <!-- imageTargetSrc points at the compiled .mind file (see README.md for how to make it).
       Every machine you want recognized needs one entity below with a matching targetIndex.
       The order of targetIndex must match the order the source images were compiled in. -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: no; uiLoading: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false;"></a-camera>

    <!-- Target slots 0-9. Add more <a-entity> blocks (with the next targetIndex) if you
         compile more than 10 marker images — just keep the numbering sequential. -->
    <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity id="target-3" mindar-image-target="targetIndex: 3"></a-entity>
    <a-entity id="target-4" mindar-image-target="targetIndex: 4"></a-entity>
    <a-entity id="target-5" mindar-image-target="targetIndex: 5"></a-entity>
    <a-entity id="target-6" mindar-image-target="targetIndex: 6"></a-entity>
    <a-entity id="target-7" mindar-image-target="targetIndex: 7"></a-entity>
    <a-entity id="target-8" mindar-image-target="targetIndex: 8"></a-entity>
    <a-entity id="target-9" mindar-image-target="targetIndex: 9"></a-entity>
  </a-scene>

  <!-- Hint shown while nothing is recognized -->
  <div id="scan-hint">
    <div class="hint-dot"></div>
    Point the camera at a labeled machine or marker
  </div>

  <!-- ============ GUIDE OVERLAY (shows when a marker is recognized) ============ -->
  <div id="guide-panel" class="hidden">
    <div id="guide-drag-handle"></div>
    <div id="guide-header">
      <div>
        <p id="guide-eyebrow">RECOGNIZED</p>
        <h2 id="guide-title">Machine name</h2>
      </div>
      <button id="close-guide" aria-label="Close">✕</button>
    </div>
    <div id="guide-body"><!-- populated by app.js --></div>
    <button id="add-more-btn" class="ghost-btn">+ Add / edit instructions for this machine</button>
  </div>

  <!-- ============ ADMIN PANEL (add / edit machine instructions) ============ -->
  <button id="admin-toggle" title="Add or edit instructions">⚙️</button>

  <div id="admin-panel" class="hidden">
    <div id="admin-card">
      <div id="admin-header">
        <h2>Manage machine guides</h2>
        <button id="close-admin" aria-label="Close">✕</button>
      </div>

      <div id="admin-body">
        <label class="field-label">Editing</label>
        <select id="machine-select">
          <option value="__new__">+ New machine…</option>
        </select>

        <div id="new-machine-fields" class="hidden">
          <label class="field-label">Target index (which compiled marker, 0-9)</label>
          <input id="new-target-index" type="number" min="0" max="9" step="1" placeholder="e.g. 1" />

          <label class="field-label">Machine name</label>
          <input id="new-machine-name" type="text" placeholder="e.g. Coffee Machine Model X" />
        </div>

        <label class="field-label">Controls / buttons on this machine</label>
        <div id="controls-list"></div>
        <button id="add-control-row" class="ghost-btn">+ Add a button/knob</button>

        <div id="admin-actions">
          <button id="save-machine" class="primary-btn">Save</button>
          <button id="delete-machine" class="danger-btn hidden">Delete this machine</button>
        </div>

        <div id="admin-io">
          <button id="export-json" class="ghost-btn">Export all guides (.json)</button>
          <label class="ghost-btn" id="import-label">
            Import guides (.json)
            <input id="import-json" type="file" accept="application/json" hidden />
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
